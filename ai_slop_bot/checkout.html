<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Slop credits</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f3ef; color: #252322; margin: 0; }
    main { max-width: 420px; margin: 12vh auto; padding: 32px; background: white; border-radius: 16px; }
    h1 { font-size: 28px; } p { line-height: 1.5; }
    #sandbox { background: #fff1c5; padding: 12px; border-radius: 8px; }
    #buttons { display: grid; gap: 12px; margin: 24px 0; }
    [hidden] { display: none !important; }
    #check { padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>AI Slop credits</h1>
  <p id="sandbox" hidden>Sandbox test. No real money changes hands, and these credits cannot be spent.</p>
  <p id="amount">Loading your checkout...</p>
  <p>Your balance updates after payment is confirmed. Closing or cancelling checkout adds no credits.</p>
  <div id="buttons" hidden>
    <paypal-button id="paypal" type="pay" hidden></paypal-button>
    <venmo-button id="venmo" type="pay" hidden></venmo-button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="check" type="button" hidden>Check payment status</button>
</main>
<script>
const config = __PAYMENT_CONFIG__;
const token = location.hash.slice(1);
const status = document.getElementById('status');
const buttons = document.getElementById('buttons');
const check = document.getElementById('check');
document.getElementById('sandbox').hidden = config.environment !== 'sandbox';

async function request(action) {
  const response = await fetch(`${config.basePath}/${action}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token}), cache: 'no-store', credentials: 'omit',
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'Please retry this checkout.');
  return data;
}

function showResult(data) {
  document.getElementById('amount').textContent = `$${data.amount} USD in credits`;
  if (data.status === 'credited') {
    buttons.hidden = true;
    check.hidden = true;
    status.textContent = config.environment === 'sandbox'
      ? 'Test payment confirmed. Credits were added to the sandbox ledger only.'
      : 'Payment confirmed! Check your balance in Slack with /slop-bot -u.';
    return true;
  }
  return false;
}

async function reconcile() {
  status.textContent = 'Confirming your payment...';
  try {
    if (!showResult(await request('capture'))) {
      status.textContent = 'Payment is not confirmed yet. No credits have been added. You can check again shortly.';
      check.hidden = false;
    }
  } catch (error) {
    status.textContent = error.message;
    check.hidden = false;
  }
}
check.addEventListener('click', reconcile);

async function initialize() {
  if (showResult(await request('status'))) return;
  const script = document.createElement('script');
  script.src = config.environment === 'sandbox'
    ? 'https://www.sandbox.paypal.com/web-sdk/v6/core'
    : 'https://www.paypal.com/web-sdk/v6/core';
  await new Promise((resolve, reject) => {
    script.onload = resolve;
    script.onerror = () => reject(new Error('Could not load PayPal. Please reload this page.'));
    document.head.appendChild(script);
  });
  const sdk = await window.paypal.createInstance({
    clientId: config.clientId, components: ['paypal-payments', 'venmo-payments'], pageType: 'checkout',
  });
  const eligible = await sdk.findEligibleMethods({currencyCode: 'USD'});
  const callbacks = {
    onApprove: reconcile,
    onCancel() { status.textContent = 'Checkout cancelled. No credits were added.'; },
    onError() {
      status.textContent = 'Checkout could not finish. Check payment status before trying again.';
      check.hidden = false;
    },
  };
  let count = 0;
  for (const [method, factory] of [
    ['paypal', 'createPayPalOneTimePaymentSession'], ['venmo', 'createVenmoOneTimePaymentSession'],
  ]) {
    if (!eligible.isEligible(method)) continue;
    const session = sdk[factory](callbacks);
    const button = document.getElementById(method);
    button.hidden = false;
    count++;
    button.addEventListener('click', async () => {
      try {
        status.textContent = '';
        check.hidden = false;
        await session.start({presentationMode: 'auto'}, request('order'));
      } catch (error) { status.textContent = error.message; }
    });
  }
  buttons.hidden = count === 0;
  if (!count) status.textContent = 'No supported payment methods are available in this browser.';
}
initialize().catch(error => { status.textContent = error.message; });
</script>
</body>
</html>
